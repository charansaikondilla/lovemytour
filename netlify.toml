[build]
  command = "npm run build"
  publish = "dist"

# Explicit passthrough for built/static assets BEFORE the SPA catch-all below.
# Netlify normally serves an exact file match first, but making it explicit
# removes any ambiguity so image/CSS/JS requests can never fall through to
# index.html under any edge-caching edge case.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
